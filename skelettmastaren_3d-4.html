<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skelettmästaren – 3D-benspel</title>
<style>
:root{--cyan:#54d9ff;--panel:rgba(5,15,36,.88);--line:rgba(105,190,255,.6);--gold:#ffd34e}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06132c;color:#f4f8ff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#173b68 0,#081b39 45%,#030916 100%)}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#83cfff 1px,transparent 1.5px);background-size:87px 87px,137px 137px;background-position:0 0,42px 26px;opacity:.34;animation:drift 50s linear infinite}
@keyframes drift{to{background-position:350px 180px,-250px 320px}}
.hud{position:fixed;inset:0;pointer-events:none;padding:clamp(10px,2vw,28px);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.panel{pointer-events:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 0 24px #1c9de333,inset 0 0 18px #398dca16;backdrop-filter:blur(12px);border-radius:18px}
.stats{width:min(190px,28vw);padding:14px 16px;display:grid;gap:12px}
.stat{text-align:center;border-bottom:1px solid #8db9df33;padding-bottom:10px}.stat:last-child{border:0;padding:0}
.stat small{display:block;font-size:12px;letter-spacing:.14em;color:#a9c8e8}.stat strong{display:block;font-size:clamp(25px,4vw,40px);line-height:1.2}.gold{color:var(--gold)}
.quiz{width:min(410px,42vw);padding:clamp(16px,2vw,26px);margin-top:6vh}
h1{font-size:clamp(17px,2vw,25px);margin:0 0 6px;text-align:center}#prompt{text-align:center;color:#b7d9f7;margin:0 0 18px;font-size:14px}
#answers{display:grid;gap:10px}.answer{width:100%;border:1px solid #76b9ef9c;background:linear-gradient(110deg,#172d4c,#10213d);color:#f4f8ff;border-radius:13px;padding:13px 12px;font-size:clamp(13px,1.45vw,17px);font-weight:650;cursor:pointer;transition:transform .15s,border .15s,background .15s;min-height:48px}
.answer:hover:not(:disabled){transform:translateY(-2px);border-color:#75e4ff;background:#173b60}.answer:focus-visible{outline:3px solid white;outline-offset:2px}
.answer.correct{background:#0d7b4b!important;border:2px solid #54ff9b!important;box-shadow:0 0 22px #26ff8a66}.answer.wrong{background:#8b1c2b!important;border:2px solid #ff5365!important;box-shadow:0 0 22px #ff334c66}
.controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:9px;align-items:center;pointer-events:auto;max-width:95vw}
.control{border:1px solid var(--line);background:var(--panel);color:#e9f6ff;border-radius:12px;padding:10px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(10px)}
.control:hover{border-color:#8ce9ff;background:#173b60}.hint{color:#b8d7f1;font-size:12px;text-align:center;max-width:260px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:#0b1b35eF;border:1px solid #65cfff;box-shadow:0 0 20px #27baff55;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;font-weight:700}
#toast.show{opacity:1}#toast.good{border-color:#4aff9b;color:#8dffc0}#toast.bad{border-color:#ff5365;color:#ff9aa6}
#legend{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);font-size:11px;color:#9fc5e6;text-align:center;pointer-events:none;background:#06152ac9;padding:6px 12px;border-radius:20px;white-space:nowrap}
@media(max-width:650px){.hud{padding:10px;gap:8px}.stats{width:100px;padding:9px}.stat small{font-size:9px}.stat strong{font-size:24px}.quiz{width:min(60vw,330px);padding:12px;margin-top:100px}#answers{gap:7px}.answer{padding:10px 6px;min-height:42px}.controls{bottom:8px}.hint{display:none}#legend{bottom:57px;font-size:10px}}
</style>
</head>
<body>
<canvas id="scene"></canvas><div id="stars"></div>
<div class="hud">
 <div class="panel stats">
  <div class="stat"><small>POÄNG</small><strong class="gold" id="score">0</strong></div>
  <div class="stat"><small>FRÅGA</small><strong id="progress">1 / 20</strong></div>
  <div class="stat"><small>REKORD</small><strong id="best" style="font-size:22px">0</strong></div>
 </div>
 <section class="panel quiz">
  <h1>Vilket ben pekas ut?</h1><p id="prompt">Välj rätt ben bland fyra alternativ.</p>
  <div id="answers"></div>
 </section>
</div>
<div id="toast"></div>
<div id="legend">Dra med musen/fingret för att rotera · Scrolla för att zooma</div>
<div class="controls">
 <button class="control" id="reset">↻ Börja om</button>
 <span class="hint">Du får 5 poäng per rätt svar. Ett fel börjar om spelet.</span>
 <button class="control" id="rotate">⟳ Auto: av</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x07152c,.035);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100); camera.position.set(0,2.5,11.8);
scene.add(new THREE.HemisphereLight(0xb9dcff,0x34291f,2.15));
const key=new THREE.DirectionalLight(0xffe7c5,3.2);key.position.set(-4,8,7);key.castShadow=true;scene.add(key);
const rim=new THREE.DirectionalLight(0x4bbfff,2.5);rim.position.set(5,4,-5);scene.add(rim);
const fill=new THREE.PointLight(0x4cbcff,1.5,15);fill.position.set(0,3,4);scene.add(fill);
const boneMat=new THREE.MeshStandardMaterial({color:0xe8d9b9,roughness:.72});
const boneLight=new THREE.MeshStandardMaterial({color:0xf0e4c9,roughness:.66});
const darkMat=new THREE.MeshStandardMaterial({color:0x2a2b2b,roughness:.9});
const highlightMat=new THREE.MeshStandardMaterial({color:0x00d9ff,emissive:0x00aaff,emissiveIntensity:1.3,roughness:.35});
const skeleton=new THREE.Group();scene.add(skeleton);
const parts={};
function add(name,mesh){mesh.castShadow=true;mesh.receiveShadow=true;skeleton.add(mesh);(parts[name]??=[]).push(mesh);return mesh}
function sphere(name,x,y,z,sx,sy,sz,mat=boneMat){const m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);return add(name,m)}
function rod(name,a,b,r1,r2,mat=boneMat,segments=10){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),segments,1),mat);m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return add(name,m)}
function capsule(name,a,b,r,mat=boneMat){rod(name,a,b,r,r,mat,12);sphere(name,...a,r,r,r,mat);sphere(name,...b,r,r,r,mat)}
function ring(name,x,y,z,rx,ry,t,mat=boneMat){const m=new THREE.Mesh(new THREE.TorusGeometry(1,t,8,24),mat);m.position.set(x,y,z);m.scale.set(rx,ry,1);m.rotation.x=Math.PI/2;return add(name,m)}
// Skull and jaw
sphere('Skalle',0,5.18,0,.57,.72,.48,boneLight);
sphere('Skalle',0,4.92,.31,.42,.28,.22,boneLight);
for(const s of [-1,1]){sphere('Skalle',s*.22,5.28,.405,.18,.23,.10,darkMat);sphere('Skalle',s*.22,5.28,.48,.105,.14,.045,darkMat)}
sphere('Skalle',0,5.02,.49,.10,.15,.07,darkMat);
for(let i=0;i<8;i++){const x=(i%4-1.5)*.15; sphere('Skalle',x,4.79-Math.floor(i/4)*.07,.48,.055,.07,.045,boneLight)}
// vertebrae and neck
for(let i=0;i<7;i++){const y=4.45-i*.17;sphere('Kota',0,y,0,.19,.10,.18,boneLight);sphere('Ryggrad',0,y-.04,-.06,.09,.10,.11,boneMat)}
// spine, ribs, sternum
for(let i=0;i<12;i++){const y=3.53-i*.19;const width=.45+Math.sin(i/12*Math.PI)*.48;const z=.02+Math.sin(i*.5)*.025;
sphere('Ryggrad',0,y,-.04,.17,.115,.16,boneLight);
for(const s of [-1,1]){
const pts=[[s*.08,y,z],[s*width*.55,y-.06,z+.08],[s*width,y-.20,z+.12],[s*(width+.04),y-.38,z+.04]];
for(let j=0;j<3;j++)capsule('Revben',pts[j],pts[j+1],.055,boneMat);
}}
rod('Revben',[0,3.65,.2],[0,1.55,.23],.12,.09,boneLight,12);
// shoulder blades and clavicles
for(const s of [-1,1]){
const scap=sphere('Skulderblad',s*.78,3.75,-.12,.34,.55,.09,boneLight);scap.rotation.z=s*-.25;
capsule('Nyckelben',[s*.08,4.15,.16],[s*.75,4.12,.16],.085,boneLight);
}
// pelvis
for(const s of [-1,1]){
const hip=sphere('Bäcken',s*.48,1.38,0,.42,.53,.22,boneLight);hip.rotation.z=s*.25;
sphere('Bäcken',s*.27,1.2,.1,.26,.27,.22,boneMat);
}
sphere('Bäcken',0,1.55,-.02,.37,.32,.18,boneLight);
ring('Bäcken',0,1.13,.1,.55,.4,.10,boneLight);
// arms
for(const s of [-1,1]){
const sh=[s*.94,3.95,.03],el=[s*1.17,2.83,.07],wr=[s*1.31,1.88,.11];
sphere('Överarmsben',...sh,.17,.18,.17,boneLight);capsule('Överarmsben',sh,el,.105,boneLight);
sphere('Överarmsben',...el,.13,.14,.13,boneMat);
capsule('Strålben',[s*1.20,2.78,.16],[s*1.30,1.93,.18],.065,boneLight);
capsule('Vadben',[s*1.13,2.78,-.02],[s*1.23,1.93,-.02],.055,boneMat);
sphere('Båtben',s*1.31,1.85,.12,.15,.13,.13,boneLight);
for(let f=0;f<5;f++){const x=s*(1.12+f*.095);const base=[x,1.82,.13],mid=[x+s*.025,1.55,.15],end=[x+s*.035,1.34-(Math.abs(f-2)*.035),.16];capsule('Fingerben',base,mid,.035,boneLight);capsule('Fingerben',mid,end,.027,boneLight)}
}
// legs
for(const s of [-1,1]){
const hip=[s*.43,1.25,0],knee=[s*.48,-.62,.05],ankle=[s*.50,-2.42,.02];
capsule('Lårben',hip,knee,.17,boneLight);sphere('Lårben',...hip,.21,.23,.2,boneLight);
sphere('Knäskål',s*.48,-.62,.23,.17,.21,.10,boneLight);
capsule('Skenben',[s*.48,-.65,.02],ankle,.105,boneLight);
capsule('Vadben',[s*.63,-.67,-.02],[s*.54,-2.40,-.03],.055,boneMat);
sphere('Hälben',s*.50,-2.45,-.02,.18,.13,.23,boneLight);
const foot=[s*.50,-2.55,.28];capsule('Hälben',[s*.50,-2.43,0],foot,.095,boneLight);
for(let t=0;t<5;t++){const x=s*(.29+t*.105);const toeStart=[x,-2.55,.28],toeMid=[x+s*.005,-2.58,.55-(Math.abs(t-2)*.035)],toeEnd=[x+s*.008,-2.59,.69-(Math.abs(t-2)*.08)];capsule('Tåben',toeStart,toeMid,.04,boneLight);capsule('Tåben',toeMid,toeEnd,.03,boneLight)}
}
// tiny ear bones, indicated near side of skull; three small ossicles each side
for(const s of [-1,1]){
capsule('Hammaren',[s*.46,5.14,.02],[s*.55,5.12,.10],.035,boneLight);
capsule('Stigbygeln',[s*.55,5.12,.10],[s*.60,5.10,.14],.022,boneLight);
}
// floor and platform
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x07152a,metalness:.25,roughness:.55}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.78;floor.receiveShadow=true;scene.add(floor);
const platform=new THREE.Mesh(new THREE.CylinderGeometry(2.25,2.42,.16,64),new THREE.MeshStandardMaterial({color:0x132b4b,metalness:.7,roughness:.3}));platform.position.y=-2.70;platform.receiveShadow=true;platform.castShadow=true;scene.add(platform);
const glow=new THREE.Mesh(new THREE.TorusGeometry(2.32,.035,8,96),new THREE.MeshBasicMaterial({color:0x27bfff}));glow.rotation.x=Math.PI/2;glow.position.y=-2.59;scene.add(glow);
for(let i=0;i<36;i++){const a=i/36*Math.PI*2;const dot=new THREE.Mesh(new THREE.BoxGeometry(.07,.025,.025),new THREE.MeshBasicMaterial({color:i%3===0?0xffd46b:0x40bfff}));dot.position.set(Math.cos(a)*2.32,-2.59,Math.sin(a)*2.32);dot.rotation.y=-a;scene.add(dot)}
skeleton.position.y=.15;
let yaw=0,pitch=0,drag=false,lastX=0,lastY=0,auto=false;
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.009;pitch+=(e.clientY-lastY)*.006;pitch=Math.max(-.65,Math.min(.65,pitch));lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{camera.position.z=Math.max(7,Math.min(16,camera.position.z+e.deltaY*.006))},{passive:true});
const bones=['Nyckelben','Stigbygeln','Vadben','Skulderblad','Båtben','Kota','Ryggrad','Hammaren','Fingerben','Hälben','Nackben','Skalle','Revben','Knäskål','Skenben','Lårben','Bäcken','Tåben','Strålben','Överarmsben'];
// Add a distinct occipital landmark to the back of skull.
sphere('Nackben',0,5.04,-.42,.38,.35,.12,boneLight);
let order=[],index=0,score=0,current='',choices=[],locked=false;
const scoreEl=document.getElementById('score'),progress=document.getElementById('progress'),bestEl=document.getElementById('best'),answers=document.getElementById('answers'),toast=document.getElementById('toast');
let best=Number(localStorage.getItem('skeletonBest')||0);bestEl.textContent=best;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setHighlight(name,on){(parts[name]||[]).forEach(m=>{if(on){m.userData.oldMat=m.material;m.material=highlightMat}else if(m.userData.oldMat){m.material=m.userData.oldMat;delete m.userData.oldMat}})}
function chooseTarget(name){const list=parts[name]||[];if(!list.length)return;const m=list[Math.floor(Math.random()*list.length)];const p=new THREE.Vector3();m.getWorldPosition(p);const dot=document.getElementById('targetLine');if(dot)dot.remove();const marker=new THREE.Mesh(new THREE.SphereGeometry(.11,16,12),new THREE.MeshBasicMaterial({color:0x35e6ff}));marker.name='targetMarker';scene.add(marker);marker.position.copy(p);marker.userData.target=true;setTimeout(()=>{if(marker.parent)scene.remove(marker)},1800)}
function toastMsg(msg,type){toast.textContent=msg;toast.className='show '+type;clearTimeout(toast._t);toast._t=setTimeout(()=>toast.className='',950)}
function newQuestion(){locked=false;current=order[index];choices=shuffle([current,...shuffle(bones.filter(b=>b!==current)).slice(0,3)]);progress.textContent=(index+1)+' / 20';document.getElementById('prompt').textContent='Vilket ben pekas ut?';answers.innerHTML='';setHighlight(current,true);chooseTarget(current);choices.forEach(c=>{const b=document.createElement('button');b.className='answer';b.textContent=c;b.onclick=()=>answer(c,b);answers.appendChild(b)})}
function answer(choice,btn){if(locked)return;locked=true;const all=[...answers.children];all.forEach(b=>b.disabled=true);if(choice===current){btn.classList.add('correct');score+=5;scoreEl.textContent=score;toastMsg('Rätt! +5 poäng','good');setTimeout(()=>{setHighlight(current,false);index++;if(index>=20){answers.innerHTML='';document.getElementById('prompt').textContent='Du klarade alla 20 ben!';progress.textContent='20 / 20';toastMsg('Snyggt! Du fick '+score+' poäng.','good');if(score>best){best=score;localStorage.setItem('skeletonBest',best);bestEl.textContent=best}const b=document.createElement('button');b.className='answer';b.textContent='Spela igen';b.onclick=reset;answers.appendChild(b)}else newQuestion()},750)}else{btn.classList.add('wrong');toastMsg('Fel svar – spelet börjar om','bad');setTimeout(reset,1050)}}
function reset(){setHighlight(current,false);order=shuffle([...bones]);index=0;score=0;scoreEl.textContent='0';newQuestion()}
document.getElementById('reset').onclick=reset;
document.getElementById('rotate').onclick=()=>{auto=!auto;document.getElementById('rotate').textContent='⟳ Auto: '+(auto?'på':'av')};
function animate(){requestAnimationFrame(animate);if(auto&&!drag)yaw+=.004;skeleton.rotation.y=yaw;skeleton.rotation.x=pitch;const marker=scene.getObjectByName('targetMarker');if(marker){marker.scale.setScalar(1+Math.sin(performance.now()*.01)*.18)}renderer.render(scene,camera)}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);reset();animate();
})();
</script>
</body>
</html>
